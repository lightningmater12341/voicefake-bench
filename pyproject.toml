[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicefake-bench"
version = "0.1.0"
description = "A reproducible benchmark for genuine versus generated speech detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
voicefake = "voicefake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
