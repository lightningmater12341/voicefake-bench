[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicefake-bench"
version = "0.1.0"
description = "A reproducible benchmark for genuine versus generated speech detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.26,<3", "scipy>=1.14,<2", "soundfile>=0.13.1,<0.14"]
models = ["scikit-learn>=1.6,<2"]
compression = ["imageio-ffmpeg>=0.6,<0.7"]

[project.scripts]
voicefake = "voicefake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
